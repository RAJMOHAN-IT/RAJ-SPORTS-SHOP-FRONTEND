```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Raj Sports Academy</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Poppins', sans-serif;
            background: #f3f4f6;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin: 0 0 5px;
            text-align: center;
            color: #b91c1c;
            font-size: 25px;
        }

        .subtitle {
            margin-top: 0;
            margin-bottom: 28px;
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font: inherit;
        }

        input:focus {
            outline: 2px solid #fca5a5;
            border-color: #b91c1c;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #b91c1c;
            color: white;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        #message {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #b91c1c;
        }
    </style>
</head>

<body>

    <main class="login-card">
        <h1>RSA Admin Login</h1>

        <p class="subtitle">Raj Sports Academy</p>

        <form id="loginForm">
            <label for="email">Admin Email</label>

            <input
                type="email"
                id="email"
                name="email"
                autocomplete="username"
                placeholder="Enter admin email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                placeholder="Enter admin password"
                required
            >

            <button type="submit" id="loginButton">
                Login
            </button>

            <p id="message" role="status" aria-live="polite"></p>
        </form>

        <a class="back-link" href="index.html">
            Back to Shop
        </a>
    </main>

    <!-- Login page loads only login.js -->
    <script src="js/login.js"></script>

</body>
</html>
